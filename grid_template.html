<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>outsync 4x8 Grid Template</title>
  <style>
    /* ==========================================================================
       1. BASE CONSTANTS (outsync.css)
       ========================================================================== */
    :root {
      --device-corner-radius: 28px;
      --base-radius: 28px;
      --padding: 8px;
      --single-line-height: 100px;
      --max-list-height: 2;
      --animation-speed: 300ms;

      --highlight-color: blue;
      --on-highlight: white;
      --off-highlight: black;

      --layer: 0;
    }

    /* ==========================================================================
       2. REACTIVE LAYER MATH ENGINE
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      --layer-corner-radius: max(
        0px,
        calc(
          max(var(--device-corner-radius), calc(var(--base-radius) * min(1, var(--layer))))
          - (var(--padding) * var(--layer))
        )
      );

      --layer-min-height: calc(
        var(--single-line-height) - (var(--padding) * var(--layer) * 2)
      );

      --layer-height: max(
        calc(var(--layer-corner-radius) * 2),
        var(--layer-min-height)
      );

      --layer-max-container-size: calc(
        (var(--layer-height) * var(--max-list-height)) +
        (var(--padding) * (var(--max-list-height) + 1))
      );

      --layer-animation-speed: max(
        0ms,
        calc(var(--animation-speed) - (50ms * var(--layer)))
      );
    }

    body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* ==========================================================================
       3. 4x8 LAUNCHER GRID ENGINE (outsync-grid.css)
       ========================================================================== */
    .outsync-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: calc(var(--padding) * 3);     /* 3x padding between components (24px) */
      padding: calc(var(--padding) * 3); /* 3x padding outer margins (24px) */
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    /* Component Surface: Layer 3 with outsync reactive corner radius */
    .o-s-card {
      --layer: 3; /* Fixed to layer 3 as requested */
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      border-radius: var(--layer-corner-radius); /* Reactive outsync curvature */
      color: #18181b;
      user-select: none;
      overflow: hidden;
      transition: background-color var(--layer-animation-speed) ease;
    }

    /* --- Column Anchors (1 to 4) --- */
    [o-s-col="1"] { grid-column-start: 1; }
    [o-s-col="2"] { grid-column-start: 2; }
    [o-s-col="3"] { grid-column-start: 3; }
    [o-s-col="4"] { grid-column-start: 4; }

    /* --- Column Spans (1 to 4) --- */
    [o-s-w="1"] { grid-column-end: span 1; }
    [o-s-w="2"] { grid-column-end: span 2; }
    [o-s-w="3"] { grid-column-end: span 3; }
    [o-s-w="4"] { grid-column-end: span 4; }

    /* --- Row Anchors (1 to 8) --- */
    [o-s-row="1"] { grid-row-start: 1; }
    [o-s-row="2"] { grid-row-start: 2; }
    [o-s-row="3"] { grid-row-start: 3; }
    [o-s-row="4"] { grid-row-start: 4; }
    [o-s-row="5"] { grid-row-start: 5; }
    [o-s-row="6"] { grid-row-start: 6; }
    [o-s-row="7"] { grid-row-start: 7; }
    [o-s-row="8"] { grid-row-start: 8; }

    /* --- Row Spans (1 to 8) --- */
    [o-s-h="1"] { grid-row-end: span 1; }
    [o-s-h="2"] { grid-row-end: span 2; }
    [o-s-h="3"] { grid-row-end: span 3; }
    [o-s-h="4"] { grid-row-end: span 4; }
  </style>
</head>
<body>
  <div class="outsync-grid">
    <!-- Row 1-2: 2x2 Square Card (Top-Left) -->
    <div o-s-col="1" o-s-row="1" o-s-w="2" o-s-h="2" class="o-s-card" style="background:#18181b; color:#fafafa;">
      <span style="font-size:13px; font-weight:700;">2x2 Card</span>
      <span style="font-size:9px; opacity:0.6;">1,1</span>
    </div>

    <!-- Row 1: 2x1 Horizontal Pill (Top-Right) -->
    <div o-s-col="3" o-s-row="1" o-s-w="2" o-s-h="1" class="o-s-card" style="background:#2563eb; color:#ffffff;">
      <span style="font-size:12px; font-weight:700;">2x1 Pill</span>
      <span style="font-size:9px; opacity:0.8;">3,1</span>
    </div>

    <!-- Row 2: Two 1x1 Action Buttons -->
    <div o-s-col="3" o-s-row="2" o-s-w="1" o-s-h="1" class="o-s-card">
      <span style="font-size:12px; font-weight:700;">1x1</span>
      <span style="font-size:9px; opacity:0.6;">3,2</span>
    </div>
    <div o-s-col="4" o-s-row="2" o-s-w="1" o-s-h="1" class="o-s-card">
      <span style="font-size:12px; font-weight:700;">1x1</span>
      <span style="font-size:9px; opacity:0.6;">4,2</span>
    </div>

    <!-- Row 3-5: 2x3 Tall Widget -->
    <div o-s-col="1" o-s-row="3" o-s-w="2" o-s-h="3" class="o-s-card">
      <span style="font-size:13px; font-weight:700;">2x3 Widget</span>
      <span style="font-size:9px; opacity:0.6;">1,3</span>
    </div>

    <!-- Row 3-4: 1x2 Vertical Pill -->
    <div o-s-col="3" o-s-row="3" o-s-w="1" o-s-h="2" class="o-s-card">
      <span style="font-size:11px; font-weight:700;">1x2</span>
      <span style="font-size:9px; opacity:0.6;">3,3</span>
    </div>

    <!-- Row 3-6: 1x4 Long Vertical Strip (Right Edge) -->
    <div o-s-col="4" o-s-row="3" o-s-w="1" o-s-h="4" class="o-s-card">
      <span style="font-size:12px; font-weight:700;">1x4</span>
      <span style="font-size:9px; opacity:0.6;">4,3</span>
    </div>

    <!-- Row 5: 1x1 Action Button -->
    <div o-s-col="3" o-s-row="5" o-s-w="1" o-s-h="1" class="o-s-card">
      <span style="font-size:12px; font-weight:700;">1x1</span>
      <span style="font-size:9px; opacity:0.6;">3,5</span>
    </div>

    <!-- Row 6-8: 1x3 Long Vertical Strip (Left Edge) -->
    <div o-s-col="1" o-s-row="6" o-s-w="1" o-s-h="3" class="o-s-card">
      <span style="font-size:11px; font-weight:700;">1x3</span>
      <span style="font-size:9px; opacity:0.6;">1,6</span>
    </div>

    <!-- Row 6: 2x1 Horizontal Pill -->
    <div o-s-col="2" o-s-row="6" o-s-w="2" o-s-h="1" class="o-s-card" style="background:#18181b; color:#fafafa;">
      <span style="font-size:12px; font-weight:700;">2x1 Pill</span>
      <span style="font-size:9px; opacity:0.6;">2,6</span>
    </div>

    <!-- Row 7-8: 2x2 Square Card (Bottom Center) -->
    <div o-s-col="2" o-s-row="7" o-s-w="2" o-s-h="2" class="o-s-card">
      <span style="font-size:13px; font-weight:700;">2x2 Card</span>
      <span style="font-size:9px; opacity:0.6;">2,7</span>
    </div>

    <!-- Row 7 & 8: Two 1x1 Action Triggers -->
    <div o-s-col="4" o-s-row="7" o-s-w="1" o-s-h="1" class="o-s-card" style="background:#22c55e; color:#ffffff;">
      <span style="font-size:12px; font-weight:700;">1x1</span>
      <span style="font-size:9px; opacity:0.8;">4,7</span>
    </div>
    <div o-s-col="4" o-s-row="8" o-s-w="1" o-s-h="1" class="o-s-card" style="background:#ef4444; color:#ffffff;">
      <span style="font-size:12px; font-weight:700;">1x1</span>
      <span style="font-size:9px; opacity:0.8;">4,8</span>
    </div>
  </div>
</body>
</html>
